[project]
name = "carv-garmin-sync"
version = "0.1.0"
description = "Synchroniseer Carv ski-sessies naar Garmin Connect"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fit-tool>=0.9.16",
    "garminconnect>=0.3.20",
    "grpcio>=1.85.0",
    "zstandard>=0.25.0",
]

[project.scripts]
carv-garmin-sync = "carv_garmin_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "fitdecode>=0.11.0",
]
